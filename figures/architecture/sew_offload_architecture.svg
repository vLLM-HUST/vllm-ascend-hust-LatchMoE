<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2468C9"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B8A67"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E88916"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C5CC4"/>
    </marker>
    <style>
      @font-face {
        font-family: "NotoCJKLocal";
        src: url("file:///root/vllm-hust-docs/presentations/vllm-hust-introduction/fonts/NotoSansCJKsc-Regular.otf") format("opentype");
        font-weight: 400 600;
      }
      @font-face {
        font-family: "NotoCJKLocal";
        src: url("file:///root/vllm-hust-docs/presentations/vllm-hust-introduction/fonts/NotoSansCJKsc-Bold.otf") format("opentype");
        font-weight: 700 900;
      }
      text {
        font-family: "Noto Sans CJK SC", "NotoCJKLocal", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        fill: #1F2933;
      }
      .title { font-size: 38px; font-weight: 800; fill: #0645AD; }
      .subtitle { font-size: 20px; font-weight: 600; fill: #52616F; }
      .section { font-size: 22px; font-weight: 800; fill: #102A43; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; font-weight: 500; fill: #4A5568; }
      .tiny { font-size: 13px; font-weight: 500; fill: #5D6B78; }
      .badge { font-size: 15px; font-weight: 800; fill: #FFFFFF; }
      .mono { font-family: "JetBrains Mono", "Consolas", monospace; font-size: 16px; font-weight: 700; }
      .outer { fill: #F8FBFF; stroke: #A8C7F0; stroke-width: 2.5; }
      .host { fill: #FFF7E8; stroke: #F2B35D; stroke-width: 2; }
      .npu { fill: #ECF8F2; stroke: #85C7A8; stroke-width: 2; }
      .graph { fill: #EEF2FF; stroke: #A9B8E8; stroke-width: 2; }
      .module { fill: #FFFFFF; stroke: #C9D6E2; stroke-width: 2; }
      .emph { fill: #EAF4FF; stroke: #78A9E6; stroke-width: 2.4; }
      .greenbox { fill: #FFFFFF; stroke: #70B99A; stroke-width: 2.4; }
      .orangebox { fill: #FFFFFF; stroke: #E9A64F; stroke-width: 2.4; }
      .purplebox { fill: #FFFFFF; stroke: #A892D6; stroke-width: 2.4; }
      .blue-arrow { stroke: #2468C9; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .green-arrow { stroke: #2B8A67; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .orange-arrow { stroke: #E88916; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .purple-arrow { stroke: #7C5CC4; stroke-width: 2.6; fill: none; marker-end: url(#arrow-purple); stroke-dasharray: 8 6; }
      .thin { stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="68" class="title">SEW-Offload：图重放安全的 MoE Expert 状态管理架构</text>
  <text x="62" y="106" class="subtitle">把动态路由产生的逻辑 Expert 变化，转化为 ACLGraph 可稳定消费的固定物理 Slot 状态</text>

  <rect x="58" y="138" width="1484" height="690" rx="20" class="outer"/>
  <text x="88" y="178" class="section">vLLM-Ascend Serving Path</text>

  <rect x="86" y="216" width="250" height="512" rx="18" fill="#FFFFFF" stroke="#C9D6E2" stroke-width="2"/>
  <text x="116" y="256" class="section">请求与模型层</text>
  <rect x="118" y="292" width="184" height="68" rx="12" class="emph"/>
  <text x="210" y="321" text-anchor="middle" class="label">Request Queue</text>
  <text x="210" y="346" text-anchor="middle" class="small">ShareGPT / online traffic</text>
  <rect x="118" y="404" width="184" height="68" rx="12" class="module"/>
  <text x="210" y="433" text-anchor="middle" class="label">vLLM Scheduler</text>
  <text x="210" y="458" text-anchor="middle" class="small">batch / prefill / decode</text>
  <rect x="118" y="516" width="184" height="72" rx="12" class="module"/>
  <text x="210" y="545" text-anchor="middle" class="label">MoE Router</text>
  <text x="210" y="570" text-anchor="middle" class="small">logical expert ids</text>
  <path d="M210 360 L210 404" class="blue-arrow thin"/>
  <path d="M210 472 L210 516" class="blue-arrow thin"/>

  <rect x="382" y="216" width="702" height="512" rx="18" fill="#FFFFFF" stroke="#9CC3F0" stroke-width="2.5"/>
  <text x="412" y="256" class="section">SEW-Offload Runtime（图外状态编排）</text>
  <text x="414" y="284" class="small">所有路由发现、Slot 分配、H2D 搬移与映射更新都在 ACLGraph replay 之前完成</text>

  <rect x="424" y="318" width="184" height="92" rx="14" class="orangebox"/>
  <circle cx="448" cy="342" r="14" fill="#E88916"/>
  <text x="448" y="348" text-anchor="middle" class="badge">1</text>
  <text x="516" y="350" text-anchor="middle" class="label">Active-Set</text>
  <text x="516" y="375" text-anchor="middle" class="label">Discovery</text>
  <text x="516" y="397" text-anchor="middle" class="tiny">per-layer routed experts</text>

  <rect x="666" y="318" width="184" height="92" rx="14" class="greenbox"/>
  <circle cx="690" cy="342" r="14" fill="#2B8A67"/>
  <text x="690" y="348" text-anchor="middle" class="badge">2</text>
  <text x="758" y="350" text-anchor="middle" class="label">Slot-Stable</text>
  <text x="758" y="375" text-anchor="middle" class="label">Virtualization</text>
  <text x="758" y="397" text-anchor="middle" class="tiny">logical expert → slot id</text>

  <rect x="908" y="318" width="136" height="92" rx="14" class="purplebox"/>
  <circle cx="932" cy="342" r="14" fill="#7C5CC4"/>
  <text x="932" y="348" text-anchor="middle" class="badge">3</text>
  <text x="976" y="354" text-anchor="middle" class="label">B2 Wave</text>
  <text x="976" y="380" text-anchor="middle" class="label">Planner</text>
  <text x="976" y="402" text-anchor="middle" class="tiny">active &gt; slots</text>

  <rect x="424" y="472" width="184" height="92" rx="14" class="orangebox"/>
  <circle cx="448" cy="496" r="14" fill="#E88916"/>
  <text x="448" y="502" text-anchor="middle" class="badge">4</text>
  <text x="516" y="504" text-anchor="middle" class="label">Transfer Engine</text>
  <text x="516" y="532" text-anchor="middle" class="small">async H2D staging</text>
  <text x="516" y="552" text-anchor="middle" class="tiny">CPU store → NPU slots</text>

  <rect x="666" y="472" width="184" height="92" rx="14" class="greenbox"/>
  <circle cx="690" cy="496" r="14" fill="#2B8A67"/>
  <text x="690" y="502" text-anchor="middle" class="badge">5</text>
  <text x="758" y="504" text-anchor="middle" class="label">Persistent</text>
  <text x="758" y="530" text-anchor="middle" class="mono">log2phy</text>
  <text x="758" y="552" text-anchor="middle" class="tiny">stable replay-visible buffer</text>

  <rect x="908" y="472" width="136" height="92" rx="14" class="purplebox"/>
  <circle cx="932" cy="496" r="14" fill="#7C5CC4"/>
  <text x="932" y="502" text-anchor="middle" class="badge">6</text>
  <text x="976" y="504" text-anchor="middle" class="label">Slot</text>
  <text x="976" y="530" text-anchor="middle" class="label">Lifecycle</text>
  <text x="976" y="552" text-anchor="middle" class="tiny">LOADING/READY/COMPUTING</text>

  <path d="M302 552 C335 552 350 364 424 364" class="blue-arrow"/>
  <path d="M608 364 L666 364" class="green-arrow"/>
  <path d="M850 364 L908 364" class="purple-arrow"/>
  <path d="M516 410 L516 472" class="orange-arrow"/>
  <path d="M608 518 L666 518" class="orange-arrow"/>
  <path d="M758 410 L758 472" class="green-arrow"/>
  <path d="M850 518 L908 518" class="purple-arrow"/>

  <rect x="424" y="610" width="620" height="72" rx="14" fill="#F7FAFC" stroke="#C9D6E2" stroke-width="2"/>
  <text x="455" y="638" class="label">核心不变量</text>
  <text x="455" y="664" class="small">固定地址｜有界 HBM｜图外搬移｜计算保护｜Prefill 分波保持语义</text>

  <line x1="1122" y1="214" x2="1122" y2="728" stroke="#C04B4B" stroke-width="3" stroke-dasharray="12 9"/>

  <rect x="1164" y="216" width="330" height="512" rx="18" class="graph"/>
  <text x="1122" y="192" text-anchor="middle" class="label" style="fill:#B83232">ACLGraph capture boundary</text>
  <text x="1122" y="214" text-anchor="middle" class="small" style="fill:#B83232">图内只读稳定地址与映射</text>
  <text x="1194" y="256" class="section">图内执行路径</text>
  <rect x="1200" y="308" width="258" height="98" rx="14" fill="#FFFFFF" stroke="#A9B8E8" stroke-width="2.4"/>
  <text x="1329" y="342" text-anchor="middle" class="label">Captured Grouped MLP</text>
  <text x="1329" y="370" text-anchor="middle" class="small">consumes fixed slot tensors</text>
  <text x="1329" y="392" text-anchor="middle" class="tiny">no host decision inside replay</text>

  <rect x="1200" y="462" width="258" height="82" rx="14" fill="#FFFFFF" stroke="#A9B8E8" stroke-width="2.4"/>
  <text x="1329" y="494" text-anchor="middle" class="label">Token Expert Output</text>
  <text x="1329" y="522" text-anchor="middle" class="small">scatter back after B2 waves</text>

  <rect x="1200" y="598" width="258" height="72" rx="14" fill="#FFFFFF" stroke="#A9B8E8" stroke-width="2.4"/>
  <text x="1329" y="628" text-anchor="middle" class="label">Next Transformer Layer</text>
  <text x="1329" y="654" text-anchor="middle" class="small">vLLM-Ascend continues</text>

  <path d="M1044 518 C1088 518 1100 358 1200 358" class="green-arrow"/>
  <path d="M1329 406 L1329 462" class="blue-arrow thin"/>
  <path d="M1329 544 L1329 598" class="blue-arrow thin"/>

  <rect x="86" y="748" width="672" height="54" rx="13" class="host"/>
  <text x="114" y="782" class="label">CPU Host Expert Store</text>
  <text x="360" y="782" class="small">offloaded expert weights in host DRAM</text>

  <rect x="790" y="748" width="704" height="54" rx="13" class="npu"/>
  <text x="818" y="782" class="label">NPU HBM State</text>
  <text x="1020" y="782" class="small">Fixed Slot Bank + persistent log2phy + lifecycle states</text>

  <path d="M516 564 C500 660 280 694 280 748" class="orange-arrow"/>
  <path d="M516 564 C580 680 948 690 948 748" class="orange-arrow"/>
  <path d="M758 564 C800 644 1000 672 1100 748" class="green-arrow"/>
  <path d="M976 564 C1014 640 1178 676 1222 748" class="purple-arrow"/>

  <rect x="106" y="824" width="1388" height="44" rx="12" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
  <circle cx="134" cy="846" r="7" fill="#2468C9"/>
  <text x="150" y="852" class="tiny">控制流 / request routing</text>
  <circle cx="360" cy="846" r="7" fill="#E88916"/>
  <text x="376" y="852" class="tiny">H2D expert weight movement</text>
  <circle cx="648" cy="846" r="7" fill="#2B8A67"/>
  <text x="664" y="852" class="tiny">replay-visible stable state</text>
  <circle cx="938" cy="846" r="7" fill="#7C5CC4"/>
  <text x="954" y="852" class="tiny">wave / lifecycle guard</text>
  <text x="1216" y="852" class="tiny">Caption: off-graph staging → stable in-graph replay.</text>
</svg>
