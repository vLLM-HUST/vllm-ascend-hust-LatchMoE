[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-moe-offload-ascend"
version = "0.1.0"
description = "Graph-compatible MoE expert offloading plugin for vLLM Ascend (LatchMoE)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# vLLM and the hook-enabled vllm-ascend-hust fork are external prerequisites.
# Do not depend on the PyPI vllm-ascend package here, because it does not
# contain the MoE offload hook seam required by this plugin.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
latchmoe = "vllm_moe_offload_ascend.launcher:main"

[project.entry-points."vllm.general_plugins"]
moe_offload_ascend = "vllm_moe_offload_ascend:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_moe_offload_ascend*"]

[tool.setuptools.package-data]
vllm_moe_offload_ascend = ["compatibility.lock"]
